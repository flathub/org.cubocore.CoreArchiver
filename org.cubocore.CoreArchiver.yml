app-id: org.cubocore.CoreArchiver
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: corearchiver
rename-desktop-file: cc.cubocore.CoreArchiver.desktop
rename-icon: cc.cubocore.CoreArchiver
rename-appdata-file: cc.cubocore.CoreArchiver.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home   # Required to archive any files and open any archived files
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - /lib/*.la
  - /lib/*.a
modules:
  - name: libcprime
    buildsystem: cmake-ninja
    config-opts: [
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    ]
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcprime.git
        commit: 17d4c94f3be2c7f67dc757cf852f0144945c2c69
        tag: v5.0.1
  - name: libarchive-qt
    buildsystem: meson
    config-opts:
      - -Duse_qt_version=qt6
    sources:
      - type: git
        url: https://gitlab.com/marcusbritanicus/libarchive-qt
        tag: v2.0.8
  - name: corearchiver
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/coreapps/corearchiver.git
        commit: 1e8604711ebaf560e937e76a9f7810752efccb98
        tag: v5.0.1
      - type: patch
        path: fix-appID-name.patch
